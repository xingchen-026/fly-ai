[project]
name = "fly-ai-survival"
version = "0.1.0"
description = "Drosophila male-CNS connectome driven infinite 2D survival world"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pygame>=2.5",
]

[project.scripts]
fly-ai = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]